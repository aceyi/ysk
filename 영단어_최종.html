<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 영단어 암기 마스터 (Day 1 ~ Day 60)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8fafc;
        }
        .font-en {
            font-family: 'Poppins', 'Noto Sans KR', sans-serif;
        }
        @media print {
            .no-print { display: none !important; }
            body { background-color: white !important; }
            .print-container { box-shadow: none !important; border: none !important; padding: 0 !important; }
            table { font-size: 11px !important; }
            td, th { padding: 4px 6px !important; }
        }
        .active-word-row {
            background-color: #eff6ff !important;
            box-shadow: inset 4px 0 0 0 #2563eb;
            transition: all 0.25s ease;
        }
        .masked-text {
            background-color: #cbd5e1;
            color: transparent !important;
            border-radius: 6px;
            user-select: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .masked-text:hover {
            background-color: #94a3b8;
        }
        .masked-text.revealed {
            background-color: transparent;
            color: inherit !important;
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between py-3 gap-3">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2.5">
                        <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-sm">
                            W
                        </div>
                        <div>
                            <h1 class="text-lg sm:text-xl font-bold text-slate-900 tracking-tight">영단어 암기 마스터 (Day 1 ~ 60)</h1>
                            <p class="text-xs text-slate-500">Day별 순서 유지 및 원어민 발음 자동재생</p>
                        </div>
                    </div>
                    <div class="flex md:hidden gap-1.5">
                        <button onclick="openWordModal()" class="p-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-medium">
                            + 단어관리
                        </button>
                    </div>
                </div>

                <div class="flex items-center bg-slate-100 p-1 rounded-xl self-stretch md:self-auto">
                    <button id="tabTableBtn" onclick="switchMode('table')" class="flex-1 md:flex-none flex items-center justify-center gap-2 px-4 py-2 rounded-lg text-sm font-bold transition-all bg-white text-blue-600 shadow-sm">
                        <span>📋</span>
                        <span>표 학습 (Day별)</span>
                    </button>
                    <button id="tabFocusBtn" onclick="switchMode('focus')" class="flex-1 md:flex-none flex items-center justify-center gap-2 px-4 py-2 rounded-lg text-sm font-bold transition-all text-slate-600 hover:text-slate-900">
                        <span>🖥️</span>
                        <span>큰 화면 한 단어씩 보기</span>
                    </button>
                </div>

                <div class="hidden md:flex items-center gap-2">
                    <button onclick="openWordModal()" class="px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-sm font-semibold transition flex items-center gap-1.5">
                        <span>➕</span> 단어 추가/편집
                    </button>
                    <button onclick="window.print()" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-xl text-sm font-semibold transition flex items-center gap-1.5">
                        <span>🖨️</span> 인쇄
                    </button>
                </div>
            </div>
        </div>

        <div class="bg-blue-50/90 border-t border-blue-100 backdrop-blur-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-2.5">
                <div class="flex flex-wrap items-center justify-between gap-3">
                    <div class="flex items-center gap-2">
                        <button id="btnStartStop" onclick="toggleAutoPlay()" class="flex items-center gap-2 px-5 py-2.5 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-bold rounded-xl shadow-sm transition-all text-sm">
                            <span id="playIcon">▶</span>
                            <span id="playLabel">START (자동읽기)</span>
                        </button>
                        <button id="btnStopReset" onclick="stopAutoPlay(true)" class="px-3.5 py-2.5 bg-white hover:bg-red-50 text-red-600 border border-red-200 font-bold rounded-xl text-sm transition active:scale-95" title="정지 및 처음으로">
                            ■ STOP
                        </button>
                        <div class="hidden sm:flex items-center gap-1.5 ml-1 px-3 py-1.5 bg-white rounded-lg border border-blue-100 text-xs font-semibold text-blue-800">
                            <span>진행:</span>
                            <span id="progressIndicator" class="font-en text-blue-600 font-bold">1 / 20</span>
                        </div>
                    </div>

                    <div class="flex flex-wrap items-center gap-2 sm:gap-4">
                        <div class="flex items-center gap-1 bg-white p-1 rounded-xl border border-blue-100 shadow-2xs">
                            <span class="text-xs font-bold text-slate-500 px-2">발음 속도</span>
                            <button onclick="setSpeechRate(1.0)" data-rate="1.0" class="rate-btn px-2.5 py-1 rounded-lg text-xs font-bold transition bg-blue-600 text-white">1.0x 보통</button>
                            <button onclick="setSpeechRate(1.2)" data-rate="1.2" class="rate-btn px-2.5 py-1 rounded-lg text-xs font-bold transition text-slate-600 hover:bg-slate-100">1.2x 빠르게</button>
                            <button onclick="setSpeechRate(1.5)" data-rate="1.5" class="rate-btn px-2.5 py-1 rounded-lg text-xs font-bold transition text-slate-600 hover:bg-slate-100">1.5x 매우빠르게</button>
                        </div>

                        <div class="flex items-center gap-2">
                            <select id="repeatSelect" onchange="updateRepeatCount(this.value)" class="bg-white border border-blue-100 text-slate-700 text-xs font-semibold rounded-xl px-2.5 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="1">1회 발음</option>
                                <option value="2" selected>2회 반복</option>
                                <option value="3">3회 반복</option>
                            </select>

                            <select id="voiceSelect" class="bg-white border border-blue-100 text-slate-700 text-xs font-semibold rounded-xl px-2.5 py-2 max-w-[140px] sm:max-w-[180px] focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="">원어민 음성 로딩중...</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div id="toastBox" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
        <div class="bg-slate-900 text-white px-4 py-3 rounded-xl shadow-lg text-sm font-medium flex items-center gap-2">
            <span id="toastIcon">ℹ️</span>
            <span id="toastMsg">메시지</span>
        </div>
    </div>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">

        <div class="flex flex-wrap items-center justify-between gap-3 mb-4 no-print">
            <div class="flex items-center gap-2">
                <label for="daySelect" class="text-xs font-bold text-slate-700">학습 Day 선택:</label>
                <select id="daySelect" onchange="changeDay(this.value)" class="bg-white border border-slate-300 text-slate-800 text-sm font-bold rounded-xl px-3 py-2 shadow-2xs focus:outline-none focus:ring-2 focus:ring-blue-500">
                </select>
            </div>

            <div id="maskControls" class="flex items-center gap-2 bg-white px-3 py-1.5 rounded-xl border border-slate-200 shadow-2xs">
                <span class="text-xs font-bold text-slate-500">암기 테스트:</span>
                <button id="btnHideWord" onclick="toggleMask('word')" class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 transition">
                    👁️ 단어 가리기
                </button>
                <button id="btnHideMeaning" onclick="toggleMask('meaning')" class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 transition">
                    👁️ 뜻 가리기
                </button>
            </div>
        </div>

        <section id="tableViewSection" class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden print-container">
            <div class="hidden print:flex items-center justify-between px-4 py-2 border-b border-slate-300">
                <h2 class="font-bold text-base" id="printPageTitle">영단어 학습장 - Day</h2>
                <span class="text-xs text-slate-500">이름: _________________ 날짜: _____________</span>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-800 text-white text-xs sm:text-sm uppercase tracking-wider">
                            <th class="py-3 px-2 sm:px-3 text-center w-12 border-r border-slate-700">No.</th>
                            <th class="py-3 px-3 sm:px-4 w-1/4 border-r border-slate-700">Word (단어)</th>
                            <th class="py-3 px-3 sm:px-4 w-1/5 border-r border-slate-700">발음기호</th>
                            <th class="py-3 px-2 sm:px-3 text-center w-20 border-r border-slate-700">품사</th>
                            <th class="py-3 px-3 sm:px-4 border-r border-slate-700">뜻 (의미)</th>
                            <th class="py-3 px-2 text-center w-14 no-print">듣기</th>
                        </tr>
                    </thead>
                    <tbody id="vocabTableBody" class="divide-y divide-slate-200 text-sm">
                    </tbody>
                </table>
            </div>
        </section>

        <section id="focusViewSection" class="hidden">
            <div class="max-w-4xl mx-auto">
                <div class="bg-white rounded-2xl p-4 mb-4 border border-slate-200 shadow-xs flex items-center justify-between gap-4">
                    <div class="flex items-center gap-3 flex-1">
                        <span id="focusDayBadge" class="px-3 py-1 bg-blue-100 text-blue-700 font-bold text-xs rounded-lg">Day 1</span>
                        <div class="flex-1 bg-slate-100 h-2.5 rounded-full overflow-hidden">
                            <div id="focusProgressBar" class="bg-blue-600 h-full transition-all duration-300" style="width: 5%"></div>
                        </div>
                        <span id="focusCounterText" class="font-en font-bold text-sm text-slate-700">1 / 20</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <label class="flex items-center gap-1.5 text-xs font-semibold text-slate-600 cursor-pointer select-none">
                            <input type="checkbox" id="focusHideMeaningToggle" onchange="renderFocusCard()" class="rounded text-blue-600 focus:ring-blue-500 w-4 h-4">
                            <span>뜻 숨기고 암기하기</span>
                        </label>
                    </div>
                </div>

                <div class="bg-white rounded-3xl shadow-md border border-slate-200 p-6 sm:p-12 text-center relative overflow-hidden transition-all">
                    <div class="flex items-center justify-between mb-6">
                        <span id="focusCardNumber" class="inline-flex items-center justify-center w-10 h-10 rounded-2xl bg-slate-100 text-slate-700 font-en font-bold text-base">
                            #01
                        </span>
                        <div class="flex items-center gap-2">
                            <span id="focusSpeakingBadge" class="hidden px-3 py-1 bg-emerald-100 text-emerald-700 text-xs font-bold rounded-full animate-pulse">
                                🔊 원어민 발음 재생중...
                            </span>
                            <button onclick="speakSingleWord(currentIndex)" class="flex items-center gap-2 px-4 py-2 bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold rounded-xl text-sm transition active:scale-95">
                                <span>🔊</span>
                                <span>다시 듣기</span>
                            </button>
                        </div>
                    </div>

                    <div class="my-6 sm:my-10">
                        <h2 id="focusWordText" class="font-en text-5xl sm:text-7xl font-extrabold text-slate-900 tracking-tight mb-4 break-words">
                            fix
                        </h2>
                        <div class="flex items-center justify-center gap-3 flex-wrap">
                            <span id="focusPhoneticText" class="font-en text-xl sm:text-2xl text-slate-500 font-medium bg-slate-50 px-4 py-1.5 rounded-xl border border-slate-200/70">
                                /fɪks/
                            </span>
                            <span id="focusPosBadge" class="px-3.5 py-1.5 bg-indigo-50 text-indigo-700 font-bold text-base sm:text-lg rounded-xl border border-indigo-100">
                                동사
                            </span>
                        </div>
                    </div>

                    <div class="border-t border-slate-100 my-6 sm:my-8"></div>

                    <div id="focusAnswerArea" class="space-y-5 transition-all">
                        <div>
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5">뜻 (Meaning)</p>
                            <p id="focusMeaningText" class="text-2xl sm:text-4xl font-bold text-blue-700 leading-snug">
                                1. 수리하다, 고치다 2. 고정시키다
                            </p>
                        </div>
                    </div>

                    <div id="focusRevealBtnBox" class="hidden my-6">
                        <button onclick="revealFocusAnswer()" class="px-8 py-4 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-2xl text-lg shadow-sm transition">
                            👀 뜻 확인하기 (Space)
                        </button>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-3 mt-5">
                    <button onclick="prevWord()" class="flex items-center justify-center gap-2 py-4 bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 font-bold rounded-2xl shadow-2xs transition active:scale-98 text-base">
                        <span>◀</span>
                        <span>이전 단어</span>
                    </button>
                    <button onclick="toggleAutoPlay()" id="focusCenterPlayBtn" class="flex items-center justify-center gap-2 py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-2xl shadow-sm transition active:scale-98 text-base">
                        <span>▶</span>
                        <span>자동 읽기 시작</span>
                    </button>
                    <button onclick="nextWord()" class="flex items-center justify-center gap-2 py-4 bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 font-bold rounded-2xl shadow-2xs transition active:scale-98 text-base">
                        <span>다음 단어</span>
                        <span>▶</span>
                    </button>
                </div>
            </div>
        </section>

    </main>

    <div id="wordModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-xl max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between border-b border-slate-200 pb-3 mb-4">
                <h3 class="text-lg font-bold text-slate-900">📝 새 단어 추가 및 관리</h3>
                <button onclick="closeWordModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
            </div>

            <form id="addWordForm" onsubmit="handleAddWord(event)" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">소속 Day 선택 *</label>
                        <select id="inputDay" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Word (영단어) *</label>
                        <input type="text" id="inputWord" required placeholder="예: achieve" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">발음기호</label>
                        <input type="text" id="inputPhonetic" placeholder="예: /əˈtʃiːv/" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">품사 *</label>
                        <select id="inputPos" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="동사">동사</option>
                            <option value="명사">명사</option>
                            <option value="형용사">형용사</option>
                            <option value="부사">부사</option>
                            <option value="전치사">전치사</option>
                            <option value="숙어">숙어</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">뜻 (의미) *</label>
                        <input type="text" id="inputMeaning" required placeholder="예: 성취하다" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                </div>

                <div class="flex items-center justify-between pt-3 border-t border-slate-100">
                    <button type="button" onclick="resetToDefaultData()" class="text-xs text-red-600 hover:underline font-semibold">
                        초기 단어장 데이터로 복원
                    </button>
                    <div class="flex gap-2">
                        <button type="button" onclick="closeWordModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-sm font-semibold">취소</button>
                        <button type="submit" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-bold">추가하기</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        const MASTER_VOCAB_DATA = {
            1: [
                { word: "fix", phonetic: "/fɪks/", pos: "동사", meaning: "1. 수리하다, 고치다 2. 고정시키다" },
                { word: "shade", phonetic: "/ʃeɪd/", pos: "명사", meaning: "그늘" },
                { word: "bury", phonetic: "/ˈberi/", pos: "동사", meaning: "(땅에) 묻다, 매장하다" },
                { word: "cave", phonetic: "/keɪv/", pos: "명사", meaning: "동굴" },
                { word: "useful", phonetic: "/ˈjuːsfl/", pos: "형용사", meaning: "쓸모있는, 유용한" },
                { word: "dot", phonetic: "/dɑːt/", pos: "명사", meaning: "(동그란) 점" },
                { word: "copy", phonetic: "/ˈkɑːpi/", pos: "동사", meaning: "1. 복사하다 2. 따라하다, 모방하다" },
                { word: "through", phonetic: "/θruː/", pos: "전치사", meaning: "(입구 등을) 통(과)하여" },
                { word: "oven", phonetic: "/ˈʌvn/", pos: "명사", meaning: "오븐" },
                { word: "lend", phonetic: "/lend/", pos: "동사", meaning: "빌려주다" },
                { word: "wing", phonetic: "/wɪŋ/", pos: "명사", meaning: "날개" },
                { word: "neighbor", phonetic: "/ˈneɪbər/", pos: "명사", meaning: "이웃" },
                { word: "piece", phonetic: "/piːs/", pos: "명사", meaning: "1. 조각 2. 한 개, 한 장" },
                { word: "still", phonetic: "/stɪl/", pos: "부사", meaning: "아직도, 여전히" },
                { word: "twin", phonetic: "/twɪn/", pos: "명사/형", meaning: "쌍둥이(의)" },
                { word: "pure", phonetic: "/pjʊr/", pos: "형용사", meaning: "1. 순수한 2. 맑은, 깨끗한" },
                { word: "stage", phonetic: "/steɪdʒ/", pos: "명사", meaning: "1. 단계, 시기 2. 무대" },
                { word: "at first", phonetic: "/æt fɜːrst/", pos: "숙어", meaning: "처음에는" },
                { word: "put on", phonetic: "/pʊt ɑːn/", pos: "숙어", meaning: "~을 입다[신다, 쓰다]" },
                { word: "moment", phonetic: "/ˈmoʊmənt/", pos: "명사", meaning: "1. (특정한) 순간 2. 잠깐" }
            ],
            2: [
                { word: "war", phonetic: "/wɔːr/", pos: "명사", meaning: "전쟁" },
                { word: "cash", phonetic: "/kæʃ/", pos: "명사", meaning: "현금" },
                { word: "advice", phonetic: "/ədˈvaɪs/", pos: "명사", meaning: "충고, 조언" },
                { word: "lead", phonetic: "/liːd/", pos: "동사", meaning: "1. 안내하다 2. 지도하다, 이끌다" },
                { word: "perfect", phonetic: "/ˈpɜːrfɪkt/", pos: "형용사", meaning: "1. 완벽한 2. 알맞은" },
                { word: "search", phonetic: "/sɜːrtʃ/", pos: "동사", meaning: "찾다, 수색하다" },
                { word: "contest", phonetic: "/ˈkɑːntest/", pos: "명사", meaning: "대회, 콘테스트" },
                { word: "display", phonetic: "/dɪˈspleɪ/", pos: "동사", meaning: "전시하다, 진열하다" },

        // 로컬 스토리지 데이터 로드
        function loadVocabData() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed && parsed[1] && parsed[60]) {
                        vocabData = parsed;
                        return;
                    }
                }
            } catch (e) {
                console.warn('저장된 데이터를 불러오는 중 오류 발생, 기본값 사용:', e);
            }
            vocabData = JSON.parse(JSON.stringify(MASTER_VOCAB_DATA));
            saveVocabData();
        }

        function saveVocabData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(vocabData));
            } catch (e) {
                console.warn('로컬 스토리지 저장 실패:', e);
            }
        }

        // Day 1 ~ 60 드롭다운 채우기
        function populateDaySelectors() {
            const daySelect = document.getElementById('daySelect');
            const inputDay = document.getElementById('inputDay');
            daySelect.innerHTML = '';
            inputDay.innerHTML = '';

            for (let d = 1; d <= 60; d++) {
                const count = (vocabData[d] || []).length;
                const opt1 = document.createElement('option');
                opt1.value = d;
                opt1.textContent = `Day ${d} (${count}단어)`;
                daySelect.appendChild(opt1);

                const opt2 = document.createElement('option');
                opt2.value = d;
                opt2.textContent = `Day ${d}`;
                inputDay.appendChild(opt2);
            }
            daySelect.value = currentDay;
            inputDay.value = currentDay;
        }

        // Day 변경 핸들러
        function changeDay(dayVal) {
            stopAutoPlay(false);
            currentDay = parseInt(dayVal, 10) || 1;
            currentIndex = 0;
            document.getElementById('daySelect').value = currentDay;
            document.getElementById('inputDay').value = currentDay;
            renderAll();
            showToast(`Day ${currentDay} 학습을 시작합니다.`, '📚');
        }

        // 전체 렌더링
        function renderAll() {
            const list = getCurrentWords();
            if (currentIndex >= list.length) {
                currentIndex = Math.max(0, list.length - 1);
            }
            renderTableView();
            renderFocusCard();
            updateProgressUI();
            document.getElementById('printPageTitle').textContent = `영단어 학습장 - Day ${currentDay}`;
        }

        function getCurrentWords() {
            return vocabData[currentDay] || [];
        }

        // 표 학습 렌더링
        function renderTableView() {
            const tbody = document.getElementById('vocabTableBody');
            const list = getCurrentWords();
            tbody.innerHTML = '';

            if (list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="py-10 text-center text-slate-400">등록된 단어가 없습니다. 상단 '+ 단어 추가/편집'에서 단어를 추가해 주세요.</td></tr>`;
                return;
            }

            list.forEach((item, idx) => {
                const tr = document.createElement('tr');
                tr.id = `word-row-${idx}`;
                tr.className = `hover:bg-slate-50 transition cursor-pointer ${idx === currentIndex ? 'active-word-row' : ''}`;
                tr.onclick = (e) => {
                    if (e.target.closest('button') || e.target.classList.contains('masked-text')) return;
                    currentIndex = idx;
                    updateActiveRow();
                    updateProgressUI();
                    speakSingleWord(idx);
                };

                const wordClass = hideWord ? 'masked-text px-2 py-0.5 inline-block' : '';
                const meaningClass = hideMeaning ? 'masked-text px-2 py-0.5 inline-block' : '';

                tr.innerHTML = `
                    <td class="py-3 px-2 sm:px-3 text-center font-en font-bold text-slate-500 border-r border-slate-100">${idx + 1}</td>
                    <td class="py-3 px-3 sm:px-4 font-en font-bold text-base sm:text-lg text-slate-900 border-r border-slate-100">
                        <span class="${wordClass}" onclick="revealSingleMask(event, this)">${escapeHtml(item.word)}</span>
                    </td>
                    <td class="py-3 px-3 sm:px-4 font-en text-slate-500 text-xs sm:text-sm border-r border-slate-100">${escapeHtml(item.phonetic || '')}</td>
                    <td class="py-3 px-2 sm:px-3 text-center border-r border-slate-100">
                        <span class="px-2 py-0.5 bg-slate-100 text-slate-700 rounded-md text-xs font-semibold">${escapeHtml(item.pos)}</span>
                    </td>
                    <td class="py-3 px-3 sm:px-4 text-slate-800 font-medium border-r border-slate-100">
                        <span class="${meaningClass}" onclick="revealSingleMask(event, this)">${escapeHtml(item.meaning)}</span>
                    </td>
                    <td class="py-3 px-2 text-center no-print">
                        <button onclick="event.stopPropagation(); currentIndex=${idx}; updateActiveRow(); speakSingleWord(${idx});" class="p-2 bg-blue-50 hover:bg-blue-100 text-blue-600 rounded-lg transition active:scale-95" title="발음 듣기">
                            🔊
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateActiveRow() {
            document.querySelectorAll('#vocabTableBody tr').forEach((row, idx) => {
                if (idx === currentIndex) {
                    row.classList.add('active-word-row');
                    row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else {
                    row.classList.remove('active-word-row');
                }
            });
        }

        // 큰 화면 카드 뷰 렌더링
        function renderFocusCard() {
            const list = getCurrentWords();
            if (list.length === 0) return;

            const item = list[currentIndex];
            const total = list.length;

            document.getElementById('focusDayBadge').textContent = `Day ${currentDay}`;
            document.getElementById('focusCounterText').textContent = `${currentIndex + 1} / ${total}`;
            document.getElementById('focusProgressBar').style.width = `${((currentIndex + 1) / total) * 100}%`;
            document.getElementById('focusCardNumber').textContent = `#${String(currentIndex + 1).padStart(2, '0')}`;
            document.getElementById('focusWordText').textContent = item.word;
            document.getElementById('focusPhoneticText').textContent = item.phonetic || '';
            document.getElementById('focusPosBadge').textContent = item.pos;
            document.getElementById('focusMeaningText').textContent = item.meaning;

            const hideToggle = document.getElementById('focusHideMeaningToggle').checked;
            const answerArea = document.getElementById('focusAnswerArea');
            const revealBox = document.getElementById('focusRevealBtnBox');

            if (hideToggle) {
                answerArea.classList.add('hidden');
                revealBox.classList.remove('hidden');
            } else {
                answerArea.classList.remove('hidden');
                revealBox.classList.add('hidden');
            }
        }

        function revealFocusAnswer() {
            document.getElementById('focusAnswerArea').classList.remove('hidden');
            document.getElementById('focusRevealBtnBox').classList.add('hidden');
        }

        function updateProgressUI() {
            const total = getCurrentWords().length;
            document.getElementById('progressIndicator').textContent = `${total > 0 ? currentIndex + 1 : 0} / ${total}`;
        }

        // 학습 모드 전환
        function switchMode(mode) {
            currentMode = mode;
            const tableSection = document.getElementById('tableViewSection');
            const focusSection = document.getElementById('focusViewSection');
            const tabTableBtn = document.getElementById('tabTableBtn');
            const tabFocusBtn = document.getElementById('tabFocusBtn');
            const maskControls = document.getElementById('maskControls');

            if (mode === 'table') {
                tableSection.classList.remove('hidden');
                focusSection.classList.add('hidden');
                maskControls.classList.remove('hidden');
                tabTableBtn.className = "flex-1 md:flex-none flex items-center justify-center gap-2 px-4 py-2 rounded-lg text-sm font-bold transition-all bg-white text-blue-600 shadow-sm";
                tabFocusBtn.className = "flex-1 md:flex-none flex items-center justify-center gap-2 px-4 py-2 rounded-lg text-sm font-bold transition-all text-slate-600 hover:text-slate-900";
                updateActiveRow();
            } else {
                tableSection.classList.add('hidden');
                focusSection.classList.remove('hidden');
                maskControls.classList.add('hidden');
                tabFocusBtn.className = "flex-1 md:flex-none flex items-center justify-center gap-2 px-4 py-2 rounded-lg text-sm font-bold transition-all bg-white text-blue-600 shadow-sm";
                tabTableBtn.className = "flex-1 md:flex-none flex items-center justify-center gap-2 px-4 py-2 rounded-lg text-sm font-bold transition-all text-slate-600 hover:text-slate-900";
                renderFocusCard();
            }
        }

        // 단어/뜻 가리기 토글
        function toggleMask(type) {
            if (type === 'word') {
                hideWord = !hideWord;
                const btn = document.getElementById('btnHideWord');
                btn.classList.toggle('bg-blue-600', hideWord);
                btn.classList.toggle('text-white', hideWord);
                btn.classList.toggle('bg-slate-100', !hideWord);
                btn.classList.toggle('text-slate-700', !hideWord);
            } else {
                hideMeaning = !hideMeaning;
                const btn = document.getElementById('btnHideMeaning');
                btn.classList.toggle('bg-blue-600', hideMeaning);
                btn.classList.toggle('text-white', hideMeaning);
                btn.classList.toggle('bg-slate-100', !hideMeaning);
                btn.classList.toggle('text-slate-700', !hideMeaning);
            }
            renderTableView();
        }

        function revealSingleMask(event, el) {
            if (el.classList.contains('masked-text')) {
                event.stopPropagation();
                el.classList.toggle('revealed');
            }
        }

        // 이전 / 다음 단어 이동
        function prevWord() {
            const list = getCurrentWords();
            if (list.length === 0) return;
            currentIndex = (currentIndex - 1 + list.length) % list.length;
            renderAll();
            speakSingleWord(currentIndex);
        }

        function nextWord() {
            const list = getCurrentWords();
            if (list.length === 0) return;
            currentIndex = (currentIndex + 1) % list.length;
            renderAll();
            speakSingleWord(currentIndex);
        }

        // 원어민 음성 합성 (TTS) 초기화 및 제어
        function initSpeechSynthesis() {
            if (!('speechSynthesis' in window)) {
                document.getElementById('voiceSelect').innerHTML = '<option value="">음성 지원 안됨</option>';
                return;
            }

            function loadVoices() {
                const allVoices = window.speechSynthesis.getVoices();
                const enVoices = allVoices.filter(v => v.lang.startsWith('en'));
                voices = enVoices.length > 0 ? enVoices : allVoices;

                const select = document.getElementById('voiceSelect');
                select.innerHTML = '';
                if (voices.length === 0) {
                    select.innerHTML = '<option value="">기본 영어 음성</option>';
                    return;
                }

                voices.forEach((v, i) => {
                    const opt = document.createElement('option');
                    opt.value = i;
                    opt.textContent = `${v.name} (${v.lang})`;
                    if (v.lang === 'en-US' && (v.name.includes('Google') || v.name.includes('Natural') || v.default)) {
                        opt.selected = true;
                    }
                    select.appendChild(opt);
                });
            }

            loadVoices();
            window.speechSynthesis.onvoiceschanged = loadVoices;
        }

        function setSpeechRate(rate) {
            speechRate = rate;
            document.querySelectorAll('.rate-btn').forEach(btn => {
                const btnRate = parseFloat(btn.getAttribute('data-rate'));
                if (btnRate === rate) {
                    btn.className = "rate-btn px-2.5 py-1 rounded-lg text-xs font-bold transition bg-blue-600 text-white";
                } else {
                    btn.className = "rate-btn px-2.5 py-1 rounded-lg text-xs font-bold transition text-slate-600 hover:bg-slate-100";
                }
            });
            showToast(`발음 속도가 ${rate.toFixed(1)}x로 변경되었습니다.`, '⚡');
        }

        function updateRepeatCount(val) {
            repeatCount = parseInt(val, 10) || 2;
        }

        function speakTextPromise(text) {
            return new Promise((resolve) => {
                if (!('speechSynthesis' in window)) {
                    setTimeout(resolve, 800);
                    return;
                }
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = 'en-US';
                utter.rate = speechRate;

                const voiceIdx = document.getElementById('voiceSelect').value;
                if (voiceIdx !== '' && voices[voiceIdx]) {
                    utter.voice = voices[voiceIdx];
                }

                const badge = document.getElementById('focusSpeakingBadge');
                if (badge) badge.classList.remove('hidden');

                utter.onend = () => {
                    if (badge) badge.classList.add('hidden');
                    resolve();
                };
                utter.onerror = () => {
                    if (badge) badge.classList.add('hidden');
                    resolve();
                };

                window.speechSynthesis.speak(utter);
            });
        }

        async function speakSingleWord(idx) {
            const list = getCurrentWords();
            if (!list[idx]) return;
            await speakTextPromise(list[idx].word);
        }

        // 자동 읽기 재생 / 정지
        function toggleAutoPlay() {
            if (isAutoPlaying) {
                stopAutoPlay(false);
            } else {
                startAutoPlay();
            }
        }

        async function startAutoPlay() {
            const list = getCurrentWords();
            if (list.length === 0) return;

            isAutoPlaying = true;
            updatePlayButtonsUI(true);
            showToast(`Day ${currentDay} 자동 읽기를 시작합니다.`, '▶️');

            while (isAutoPlaying && currentIndex < list.length) {
                renderAll();
                const wordObj = list[currentIndex];

                for (let r = 0; r < repeatCount; r++) {
                    if (!isAutoPlaying) break;
                    await speakTextPromise(wordObj.word);
                    if (!isAutoPlaying) break;
                    await sleep(450);
                }

                if (!isAutoPlaying) break;
                await sleep(600);

                if (!isAutoPlaying) break;
                if (currentIndex < list.length - 1) {
                    currentIndex++;
                } else {
                    showToast(`Day ${currentDay} 학습을 모두 완료했습니다!`, '🎉');
                    stopAutoPlay(false);
                    break;
                }
            }
        }

        function stopAutoPlay(resetToFirst) {
            isAutoPlaying = false;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
            const badge = document.getElementById('focusSpeakingBadge');
            if (badge) badge.classList.add('hidden');

            updatePlayButtonsUI(false);

            if (resetToFirst) {
                currentIndex = 0;
                renderAll();
                showToast('정지하고 첫 번째 단어로 돌아갔습니다.', '⏹️');
            }
        }

        function updatePlayButtonsUI(playing) {
            const btnStartStop = document.getElementById('btnStartStop');
            const playIcon = document.getElementById('playIcon');
            const playLabel = document.getElementById('playLabel');
            const centerBtn = document.getElementById('focusCenterPlayBtn');

            if (playing) {
                btnStartStop.className = "flex items-center gap-2 px-5 py-2.5 bg-amber-500 hover:bg-amber-600 active:scale-95 text-white font-bold rounded-xl shadow-sm transition-all text-sm";
                playIcon.textContent = "⏸";
                playLabel.textContent = "PAUSE (일시정지)";
                if (centerBtn) {
                    centerBtn.className = "flex items-center justify-center gap-2 py-4 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-2xl shadow-sm transition active:scale-98 text-base";
                    centerBtn.innerHTML = `<span>⏸</span><span>일시정지</span>`;
                }
            } else {
                btnStartStop.className = "flex items-center gap-2 px-5 py-2.5 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-bold rounded-xl shadow-sm transition-all text-sm";
                playIcon.textContent = "▶";
                playLabel.textContent = "START (자동읽기)";
                if (centerBtn) {
                    centerBtn.className = "flex items-center justify-center gap-2 py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-2xl shadow-sm transition active:scale-98 text-base";
                    centerBtn.innerHTML = `<span>▶</span><span>자동 읽기 시작</span>`;
                }
            }
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // 단어 추가 모달
        function openWordModal() {
            const modal = document.getElementById('wordModal');
            document.getElementById('inputDay').value = currentDay;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeWordModal() {
            const modal = document.getElementById('wordModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function handleAddWord(e) {
            e.preventDefault();
            const day = parseInt(document.getElementById('inputDay').value, 10);
            const word = document.getElementById('inputWord').value.trim();
            const phonetic = document.getElementById('inputPhonetic').value.trim();
            const pos = document.getElementById('inputPos').value;
            const meaning = document.getElementById('inputMeaning').value.trim();

            if (!word || !meaning) return;

            if (!vocabData[day]) vocabData[day] = [];
            vocabData[day].push({ word, phonetic, pos, meaning });
            saveVocabData();

            document.getElementById('addWordForm').reset();
            closeWordModal();
            populateDaySelectors();
            if (day === currentDay) {
                renderAll();
            }
            showToast(`Day ${day}에 '${word}' 단어가 추가되었습니다.`, '✅');
        }

        function resetToDefaultData() {
            if (!confirm('추가하거나 수정한 내용을 초기화하고 기본 Day 1 ~ Day 60 (1,200단어) 데이터로 복원하시겠습니까?')) return;
            vocabData = JSON.parse(JSON.stringify(MASTER_VOCAB_DATA));
            saveVocabData();
            populateDaySelectors();
            currentIndex = 0;
            renderAll();
            closeWordModal();
            showToast('초기 1,200단어 데이터로 복원되었습니다.', '🔄');
        }

        // 키보드 단축키
        function setupKeyboardShortcuts() {
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;

                if (e.code === 'ArrowRight') {
                    e.preventDefault();
                    nextWord();
                } else if (e.code === 'ArrowLeft') {
                    e.preventDefault();
                    prevWord();
                } else if (e.code === 'Space') {
                    e.preventDefault();
                    if (currentMode === 'focus' && document.getElementById('focusHideMeaningToggle').checked) {
                        revealFocusAnswer();
                    } else {
                        speakSingleWord(currentIndex);
                    }
                }
            });
        }

        // 토스트 알림
        let toastTimeout = null;
        function showToast(msg, icon = 'ℹ️') {
            const box = document.getElementById('toastBox');
            document.getElementById('toastMsg').textContent = msg;
            document.getElementById('toastIcon').textContent = icon;
            box.classList.remove('translate-y-20', 'opacity-0');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                box.classList.add('translate-y-20', 'opacity-0');
            }, 2600);
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }
    </script>
</body>
</html>
